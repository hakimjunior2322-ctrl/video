<script type="text/babel">
const { useEffect, useRef, useState } = React;

// ── Anxiogenic audio: heartbeat + low drone + occasional stings ────────────
function useAnxiousAudio(playing) {
  const ctxRef = useRef(null);
  const nodesRef = useRef({});
  const stingTimerRef = useRef(null);

  useEffect(() => {
    if (!playing) return;
    let ctx;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch { return; }
    ctxRef.current = ctx;

    // Low drone (sub bass)
    const drone = ctx.createOscillator();
    drone.type = 'sawtooth';
    drone.frequency.value = 42;
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.05;
    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 180;
    drone.connect(droneFilter).connect(droneGain).connect(ctx.destination);
    drone.start();

    // Second drone (dissonant)
    const drone2 = ctx.createOscillator();
    drone2.type = 'sawtooth';
    drone2.frequency.value = 44.7;
    const drone2Gain = ctx.createGain();
    drone2Gain.gain.value = 0.035;
    drone2.connect(droneFilter);
    drone2.connect(drone2Gain).connect(ctx.destination);
    drone2.start();

    // Heartbeat (kick-style thump)
    const heartbeat = () => {
      const now = ctx.currentTime;
      const make = (offset) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(85, now + offset);
        o.frequency.exponentialRampToValueAtTime(35, now + offset + 0.18);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now + offset);
        g.gain.exponentialRampToValueAtTime(0.5, now + offset + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.22);
        o.connect(g).connect(ctx.destination);
        o.start(now + offset);
        o.stop(now + offset + 0.25);
      };
      make(0);
      make(0.22);
    };
    // Heart rate accelerates over time
    let beat = 0;
    const startTime = ctx.currentTime;
    const beatLoop = () => {
      const elapsed = ctx.currentTime - startTime;
      // 60 bpm at 0s -> 130 bpm at 17s
      const bpm = 60 + Math.min(70, elapsed * 4);
      const interval = 60 / bpm;
      heartbeat();
      stingTimerRef.current = setTimeout(beatLoop, interval * 1000);
    };
    beatLoop();

    nodesRef.current = { ctx, drone, drone2 };

    return () => {
      try {
        if (stingTimerRef.current) clearTimeout(stingTimerRef.current);
        drone.stop(); drone2.stop();
        ctx.close();
      } catch {}
    };
  }, [playing]);
}

function AudioToggle() {
  const [on, setOn] = useState(false);
  useAnxiousAudio(on);
  return (
    <button onClick={() => setOn(o => !o)} style={{
      position:'fixed', top:12, right:12, zIndex:200,
      background:'rgba(20,20,20,0.85)', color:'#fff',
      border:'1px solid rgba(255,255,255,0.15)',
      borderRadius:6, padding:'6px 12px', fontSize:12,
      fontFamily:'Inter, sans-serif', cursor:'pointer',
    }}>
      {on ? '🔊 Son ON' : '🔇 Son OFF'}
    </button>
  );
}

}

// ── Day badges (top-left) ─────────────────────────────────────────────────

// ── Glitch transitions between scenes ─────────────────────────────────────
function Glitches() {
  const cuts = [3.0, 6.0, 9.0, 12.0, 14.5, 17.0];
  return (
    <>
      {cuts.map((t,i)=>(
        <Sprite key={i} start={t-0.06} end={t+0.06}>
          <div style={{
            position:'absolute', inset:0,
            background:'#fff',
            mixBlendMode:'difference',
            opacity: 0.85,
            zIndex:80,
          }}/>
        </Sprite>
      ))}
    </>
  );
}

// ── Heartbeat intensity ramp ──────────────────────────────────────────────
function HeartbeatRamp() {
  const t = useTime();
  // intensity ramps 0 → 1 across the video, with bumps at scene cuts
  const base = clamp(t / 18, 0, 1);
  const cuts = [3.0, 6.0, 9.0, 12.0, 14.5, 17.0];
  let bump = 0;
  for (const c of cuts) {
    const dt = t - c;
    if (dt > 0 && dt < 0.5) bump = Math.max(bump, (1 - dt/0.5) * 0.6);
  }
  // BPM ramps with intensity
  const bpm = 60 + base * 60;
  return <HeartbeatPulse bpm={bpm} intensity={clamp(base + bump, 0, 1)} />;
}

// ── Camera shake intensity ramp ───────────────────────────────────────────
function ShakeWrapper({ children }) {
  const t = useTime();
  const base = clamp((t - 6) / 14, 0, 1) * 4;
  const cuts = [3.0, 6.0, 9.0, 12.0, 14.5, 17.0];
  let bump = 0;
  for (const c of cuts) {
    const dt = t - c;
    if (dt > 0 && dt < 0.4) bump = Math.max(bump, (1 - dt/0.4) * 12);
  }
  return <CameraShake intensity={base + bump}>{children}</CameraShake>;
}

        <FilmGrain />
        <HeartbeatRamp />
        <Vignette />
        <DayBadges />
        <Subtitles />
      </Stage>
    </>
  );
}
